version: "3.9"

# Edu CRM — MongoDB, backend va frontendni bitta buyruq bilan ishga tushirish uchun.
#
# Ishga tushirish:  docker compose up -d --build
# Backend:  http://localhost:3000/api
# Frontend: http://localhost:5173

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: "mongodb://mongo:27017/edu_crm"
      # Production'da albatta o'zgartiring (masalan: openssl rand -hex 32)
      JWT_SECRET: "${JWT_SECRET:-o'zgartiring-maxfiy-kalit}"
      JWT_EXPIRES_IN: "7d"
      PORT: 3000
      FRONTEND_URL: "http://localhost:5173"
      TELEGRAM_BOT_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      SEED_ADMIN_PHONE: "+998900000000"
      SEED_ADMIN_PASSWORD: "admin12345"
      SEED_ADMIN_NAME: "Bosh administrator"
    ports:
      - "3000:3000"
    volumes:
      # Yuklangan fayllar (hujjatlar, avatarlar, uyga vazifalar) konteyner qayta yaratilganda yo'qolmasin.
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      # Vite o'zgaruvchilari build paytida kodga "pishiriladi" — shuning uchun runtime
      # environment emas, build argument sifatida beriladi.
      args:
        VITE_API_URL: "http://localhost:3000/api"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
  uploads_data:
