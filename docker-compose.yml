version: "3.9"

# Edu CRM — MongoDB (replica set, Prisma uchun shart), backend va frontendni
# bitta buyruq bilan ishga tushirish uchun.
#
# Ishga tushirish:  docker compose up -d --build
# Backend:  http://localhost:3000/api
# Frontend: http://localhost:5173

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: "mongodb://mongo:27017/edu_crm?replicaSet=rs0"
      JWT_SECRET: "o'zgartiring-maxfiy-kalit"
      JWT_EXPIRES_IN: "7d"
      PORT: 3000
      FRONTEND_URL: "http://localhost:5173"
      TELEGRAM_BOT_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      SEED_ADMIN_PHONE: "+998900000000"
      SEED_ADMIN_PASSWORD: "admin12345"
      SEED_ADMIN_NAME: "Bosh administrator"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:3000/api"
    ports:
      - "5173:80"

volumes:
  mongo_data:
